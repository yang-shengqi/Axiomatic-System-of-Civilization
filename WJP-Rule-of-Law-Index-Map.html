<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🌍 世界正义工程（World Justice Project）法治指数地图</title>
    <style>

        #top-controls {

            background:rgba(255,255,255,0.95); border-radius:16px; padding:14px 20px 16px 20px;
            box-shadow:0 4px 20px rgba(0,0,0,0.12); backdrop-filter:blur(4px);
            border:1px solid rgba(255,255,255,0.5); display:flex; flex-direction:column;
            align-items:center; gap:10px; min-width:320px; max-width:90%; pointer-events:auto;
        }
        .search-row { display:flex; align-items:center; width:100%; gap:8px; }
        #search-input { flex:1; border:none; border-bottom:1px solid #ccc; outline:none; padding:6px 8px; font-size:15px; background:transparent; color:#333; min-width:0; transition:border-color 0.2s; }
        #search-input:focus { border-bottom-color:#4a8bc2; }
        #search-input::placeholder { color:#aaa; }
        #search-btn { background:#4a8bc2; color:#fff; border:none; border-radius:20px; padding:6px 18px; font-size:14px; cursor:pointer; white-space:nowrap; }
        #search-btn:hover { background:#2c6fa8; }
        #search-clear { background:transparent; border:none; color:#999; font-size:18px; cursor:pointer; padding:0 6px; display:none; }
        #search-clear:hover { color:#555; }
        .control-row { display:flex; align-items:center; width:100%; justify-content:center; gap:12px; flex-wrap:wrap; }
        #import-btn { background:#4a8bc2; color:#fff; border:none; border-radius:20px; padding:6px 20px; font-size:14px; cursor:pointer; }
        #import-btn:hover { background:#2c6fa8; }

        #data-status.loaded { color:#4a8bc2; }
        #search-result {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%);

            white-space:nowrap; border:1px solid rgba(255,255,255,0.15);

        #search-result span { color:#ffd966; font-weight:bold; }

            position:fixed; top:0; left:0; z-index:100;
            background:rgba(255,255,255,0.95); border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.15);
            padding:18px 24px; max-width:280px; min-width:200px; backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.3); display:none; pointer-events:auto; transition:opacity 0.2s;
        }
        #info-panel .country-name { font-size:18px; font-weight:bold; color:#222; border-bottom:2px solid #4a8bc2; padding-bottom:6px; margin-bottom:10px; }

        #info-panel .dimension .label { color:#555; }
        #info-panel .dimension .value { font-weight:600; color:#2c6fa8; }
        #info-panel .no-data { color:#999; font-size:14px; text-align:center; padding:10px 0; }
        #info-panel .close-btn { position:absolute; top:8px; right:12px; background:none; border:none; font-size:18px; color:#aaa; cursor:pointer; pointer-events:auto; }
        #info-panel .close-btn:hover { color:#555; }

            position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200;
            pointer-events:none; color:#888; text-align:center; line-height:1.6; font-size:12px;
        }
        #footer .zh { font-size:13px; letter-spacing:0.5px; }
        #footer .en { font-size:11px; opacity:0.6; }
        @media (max-width:600px) {
            #title-area { top:12px; }
            #title-area h1 { font-size:18px; }
            #title-area .sub { font-size:12px; }
            #top-controls { top:70px; min-width:unset; width:90%; padding:10px 14px 12px 14px; }
            #search-input { font-size:14px; }
            #search-result { bottom:70px; font-size:13px; padding:6px 16px; white-space:normal; }
            #info-panel { max-width:200px; padding:12px 16px; }
            #footer .zh { font-size:12px; }
            #footer .en { font-size:10px; }
            .control-row { gap:6px; }
        }
    </style>
</head>
<body>

                "索马里":"Somalia","南苏丹":"South Sudan","斯里兰卡":"Sri Lanka","苏丹":"Sudan",
                "苏里南":"Suriname","叙利亚":"Syria","台湾地区":"Taiwan","塔吉克斯坦":"Tajikistan",
                "坦桑尼亚":"Tanzania","东帝汶":"Timor-Leste","多哥":"Togo","汤加":"Tonga",
                "特立尼达和多巴哥":"Trinidad and Tobago","突尼斯":"Tunisia","土库曼斯坦":"Turkmenistan",
                "图瓦卢":"Tuvalu","乌干达":"Uganda","乌克兰":"Ukraine","乌拉圭":"Uruguay",
                "乌兹别克斯坦":"Uzbekistan","瓦努阿图":"Vanuatu","梵蒂冈":"Vatican City",
                "委内瑞拉":"Venezuela","也门":"Yemen","赞比亚":"Zambia","津巴布韦":"Zimbabwe",
                "格陵兰":"Greenland","英格兰":"England","科特迪瓦":"Côte d'Ivoire"
            };

            var abbreviationMap = { "United States":"USA", "United Kingdom":"UK", "United Arab Emirates":"UAE" };
            var factorMap = { "Factor1":"政府权力约束", "Factor2":"廉洁程度", "Factor3":"政府透明度", "Factor4":"基本权利保障", "Factor5":"秩序与安全", "Factor6":"监管执法", "Factor7":"民事司法", "Factor8":"刑事司法" };

            function fmt(v) { return (v===null||v===undefined||isNaN(v))?'--':Number(v).toFixed(2); }

            var wjpData = {};
            function findData(mapName) {
                if(!mapName) return null;
                var lower = mapName.toLowerCase().trim();
                if(wjpData[lower]) return wjpData[lower];
                var formal = aliasToFormal[lower];
                if(formal && wjpData[formal.toLowerCase()]) return wjpData[formal.toLowerCase()];
                for(var key in wjpData) {
                    if(key.includes(lower) || lower.includes(key)) return wjpData[key];
                }
                return null;
            }

            // ========== 地图加载 ==========
            // 使用在线数据源（已内嵌新加坡）
            var MIRRORS = [
                'world.geojson',   // 本地文件（如果有）
                'https://cdn.jsdelivr.net/gh/holtzy/D3-graph-gallery@master/DATA/world.geojson',
                'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson'
            ];
            var myChart = null, worldData = null, countryCenter = {}, mapNames = [];

            function calcCenter(feature) {
                var geom = feature.geometry;
                if(!geom) return null;
                var coords = null;
                if(geom.type==='Polygon') coords = geom.coordinates[0];
                else if(geom.type==='MultiPolygon') coords = geom.coordinates[0][0];
                else return null;
                if(!coords || coords.length<3) return null;
                var lats=0,lons=0,count=0;
                for(var i=0;i<coords.length;i++) {
                    var lon=coords[i][0], lat=coords[i][1];
                    if(isFinite(lon)&&isFinite(lat)) { lons+=lon; lats+=lat; count++; }
                }
                return count ? [lons/count, lats/count] : null;
            }

            function tryLoadMirror(index) {
                if(index>=MIRRORS.length) {
                    document.getElementById('map').innerHTML = '<div style="text-align:center;padding-top:100px;color:#999;">❌ 地图数据加载失败，请检查网络连接。</div>';
                    return;
                }
                var url = MIRRORS[index];
                fetch(url)
                    .then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
                    .then(data => {
                        worldData = data;
                        if(!worldData.features || !worldData.features.length) throw new Error('数据为空');
                        initMap();
                    })
                    .catch(err => {
                        console.warn('加载失败，尝试下一个镜像', err);
                        tryLoadMirror(index+1);
                    });
            }

            var panel, panelCountry, panelRank, panelDims, panelNoData, panelClose;

            function showCountryInfo(name, mouseX, mouseY) {
                if(!panel) return;
                var lower = name.toLowerCase().trim();
                var formalName = aliasToFormal[lower] || name;
                var chinese = (function() {
                    for(var zh in chineseToFormal) {
                        if(chineseToFormal[zh].toLowerCase() === formalName.toLowerCase()) return zh;
                    }
                    return formalName;
                })();
                var displaySuffix = abbreviationMap[formalName] || formalName;
                panelCountry.textContent = chinese + ' (' + displaySuffix + ')';
                var data = findData(formalName);
                if(data) {
                    panelRank.innerHTML = '🏆 全球法治排名：<span>第 '+data.rankNumber+' 名</span><br>📊 法治指数：<span>'+fmt(data.score)+'</span>';
                    var dimsHtml = '';
                    for(var key in data.dims) {
                        var val = data.dims[key];
                        if(val!==null) {
                            var label = factorMap[key] || key;
                            dimsHtml += '<div class="dimension"><span class="label">'+label+'</span><span class="value">'+fmt(val)+'</span></div>';
                        }
                    }
                    if(dimsHtml==='') dimsHtml = '<div style="color:#999;font-size:13px;">无维度数据</div>';
                    panelDims.innerHTML = dimsHtml;
                    panelNoData.style.display = 'none';
                } else {
                    panelRank.innerHTML = '';
                    panelDims.innerHTML = '';
                    panelNoData.style.display = 'block';
                }
                var panelWidth=280, panelHeight=300;
                var left=mouseX||100, top=(mouseY||100)+30;
                var vw=window.innerWidth, vh=window.innerHeight;
                if(left+panelWidth>vw) left=vw-panelWidth-10;
                if(left<10) left=10;
                if(top+panelHeight>vh) top=(mouseY||100)-panelHeight-30;
                if(top<10) top=10;
                panel.style.left=left+'px';
                panel.style.top=top+'px';
                panel.style.display='block';
            }

            function focusCountry(query, formalName) {
                var target = formalName || query;
                if(!target) return;
                var targetLower = target.toLowerCase().trim();
                var originalName = null;
                function clean(str) { return str.replace(/[^a-z0-9]/g,''); }
                var targetClean = clean(targetLower);
                for(var i=0;i<mapNames.length;i++) {
                    if(mapNames[i].toLowerCase()===targetLower) { originalName=mapNames[i]; break; }
                }
                if(!originalName) {
                    for(var i=0;i<mapNames.length;i++) {
                        var keyLower=mapNames[i].toLowerCase();
                        if(keyLower.includes(targetLower)||targetLower.includes(keyLower)) { originalName=mapNames[i]; break; }
                    }
                }
                if(!originalName) {
                    for(var i=0;i<mapNames.length;i++) {
                        var keyClean=clean(mapNames[i].toLowerCase());
                        if(keyClean.includes(targetClean)||targetClean.includes(keyClean)) { originalName=mapNames[i]; break; }
                    }
                }
                if(!originalName) {
                    var std = aliasToFormal[targetLower] || target;
                    var stdLower = std.toLowerCase();
                    for(var i=0;i<mapNames.length;i++) {
                        var keyLower=mapNames[i].toLowerCase();
                        var keyStd=aliasToFormal[keyLower]||mapNames[i];
                        if(keyStd.toLowerCase()===stdLower) { originalName=mapNames[i]; break; }
                    }
                }
                if(!originalName) {
                    console.warn('未找到匹配的国家:', target);
                    return;
                }
                var option = myChart.getOption();
                var seriesData = option.series && option.series[0] ? option.series[0].data : null;
                if(seriesData) {
                    seriesData.forEach(function(d) { if(d.name) myChart.dispatchAction({type:'unselect',seriesIndex:0,name:d.name}); });
                }
                myChart.dispatchAction({type:'mapSelect', seriesIndex:0, name:originalName});
                var center = countryCenter[originalName];
                if(center) {
                    myChart.setOption({ series:[{center:center, zoom:4}] });
                }
            }

            // ========== 初始化地图 ==========
            function initMap() {
                try {
                    // ---------- 手动添加新加坡 ----------
                    var singaporeFeature = {
                        "type":"Feature",
                        "properties":{"name":"Singapore"},
                        "geometry":{
                            "type":"Polygon",
                            "coordinates":[[
                                [103.8198,1.3521],[103.8586,1.3448],[103.8944,1.3332],
                                [103.9214,1.3219],[103.9397,1.3054],[103.9476,1.2896],
                                [103.9444,1.2725],[103.9297,1.2578],[103.9061,1.2489],
                                [103.8765,1.2461],[103.8486,1.2507],[103.8273,1.2619],
                                [103.8123,1.2773],[103.8054,1.2934],[103.8054,1.3102],
                                [103.8123,1.3255],[103.8198,1.3521]
                            ]]
                        }
                    };
                    worldData.features.push(singaporeFeature);
                    // ---------- 注册地图 ----------
                    myChart = echarts.init(document.getElementById('map'));
                    echarts.registerMap('world', worldData);

                    worldData.features.forEach(function(f) {
                        var rawName = f.properties.name || f.properties.NAME || '';
                        if(rawName) {
                            mapNames.push(rawName);
                            countryCenter[rawName] = calcCenter(f);
                        }
                    });
                    console.log('✅ 地图加载完成，国家数:', mapNames.length);

                    var option = {
                        tooltip: {
                            trigger:'item',
                            formatter:function(params) {
                                var name = params.name;
                                var lower = name.toLowerCase().trim();
                                var formalName = aliasToFormal[lower] || name;
                                var chinese = (function() {
                                    for(var zh in chineseToFormal) {
                                        if(chineseToFormal[zh].toLowerCase()===formalName.toLowerCase()) return zh;
                                    }
                                    return formalName;
                                })();
                                var suffix = abbreviationMap[formalName] || formalName;
                                return '<strong>'+chinese+'</strong> <span style="color:#999;">('+suffix+')</span>';
                            },
                            backgroundColor:'rgba(0,0,0,0.8)',
                            borderColor:'#666',
                            borderWidth:1,
                            padding:[5,12],
                            textStyle:{color:'#fff',fontSize:14,fontFamily:'Microsoft YaHei, sans-serif'},
                            extraCssText:'border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.3);'
                        },
                        series:[{
                            type:'map',
                            map:'world',
                            roam:true,
                            selectedMode:'single',
                            label:{show:false},
                            itemStyle:{ areaColor:'#d0d8e0', borderColor:'#ffffff', borderWidth:1 },
                            emphasis:{ itemStyle:{ areaColor:'#4a8bc2', borderWidth:0 }, label:{show:false} },
                            select:{ itemStyle:{ areaColor:'#4a8bc2', borderWidth:0 }, label:{show:false} },
                            data: worldData.features.map(function(f) {
                                return { name: f.properties.name || f.properties.NAME, value:0 };
                            })
                        }]
                    };
                    myChart.setOption(option);
                    window.addEventListener('resize', function(){ myChart.resize(); });

                    // ----- 面板与搜索 -----
                    panel = document.getElementById('info-panel');
                    panelCountry = document.getElementById('panel-country');
                    panelRank = document.getElementById('panel-rank');
                    panelDims = document.getElementById('panel-dimensions');
                    panelNoData = document.getElementById('panel-no-data');
                    panelClose = document.getElementById('panel-close');
                    panelClose.addEventListener('click', function(){ panel.style.display='none'; });

                    var input = document.getElementById('search-input');
                    var btn = document.getElementById('search-btn');
                    var clearBtn = document.getElementById('search-clear');
                    var resultDiv = document.getElementById('search-result');

                    function doSearch() {
                        var query = input.value.trim();
                        var option = myChart.getOption();
                        var seriesData = option.series && option.series[0] ? option.series[0].data : null;
                        if(seriesData) {
                            seriesData.forEach(function(d) { if(d.name) myChart.dispatchAction({type:'unselect',seriesIndex:0,name:d.name}); });
                        }
                        resultDiv.style.display = 'none';
                        clearBtn.style.display = 'none';
                        if(!query) { panel.style.display='none'; return; }
                        clearBtn.style.display = 'block';

                        var formalName = null;
                        var lowerQuery = query.toLowerCase();
                        if(chineseToFormal[query]) { formalName = chineseToFormal[query]; }
                        if(!formalName && aliasToFormal[lowerQuery]) { formalName = aliasToFormal[lowerQuery]; }
                        if(!formalName) {
                            for(var i=0;i<mapNames.length;i++) {
                                var keyLower = mapNames[i].toLowerCase();
                                if(keyLower.includes(lowerQuery) || lowerQuery.includes(keyLower)) {
                                    formalName = aliasToFormal[keyLower] || mapNames[i];
                                    break;
                                }
                            }
                        }
                        if(!formalName) {
                            for(var zh in chineseToFormal) {
                                if(zh.includes(query) || query.includes(zh)) {
                                    formalName = chineseToFormal[zh];
                                    break;
                                }
                            }
                        }

                        var target = formalName || query;
                        var displayName = formalName || query;
                        var chinese = (function() {
                            for(var zh in chineseToFormal) {
                                if(chineseToFormal[zh].toLowerCase()===displayName.toLowerCase()) return zh;
                            }
                            return displayName;
                        })();
                        var suffix = abbreviationMap[displayName] || displayName;
                        resultDiv.innerHTML = '📍 定位到：<span>'+chinese+' ('+suffix+')</span>';
                        resultDiv.style.display = 'block';
                        focusCountry(query, formalName);
                        panel.style.display = 'none';
                    }

                    input.addEventListener('input', function() {
                        clearTimeout(this._timer);
                        this._timer = setTimeout(doSearch, 300);
                    });
                    btn.addEventListener('click', doSearch);
                    clearBtn.addEventListener('click', function() {
                        input.value='';
                        clearBtn.style.display='none';
                        resultDiv.style.display='none';
                        panel.style.display='none';
                        var option = myChart.getOption();
                        var data = option.series && option.series[0] ? option.series[0].data : null;
                        if(data) {
                            data.forEach(function(d) { myChart.dispatchAction({type:'unselect',seriesIndex:0,name:d.name}); });
                        }
                        myChart.setOption({ series:[{center:undefined, zoom:undefined}] });
                        input.focus();
                    });
                    input.addEventListener('keydown', function(e) {
                        if(e.key==='Enter') { doSearch(); e.preventDefault(); }
                    });

                    // ----- 导入数据 -----
                    var importBtn = document.getElementById('import-btn');
                    var fileInput = document.getElementById('file-input');
                    var dataStatus = document.getElementById('data-status');

                    importBtn.addEventListener('click', function(){ fileInput.click(); });
                    fileInput.addEventListener('change', function(e) {
                        var file = e.target.files[0];
                        if(!file) return;
                        dataStatus.textContent = '解析中...';
                        dataStatus.className = '';
                        Papa.parse(file, {
                            header:true,
                            skipEmptyLines:true,
                            complete:function(results) {
                                var data = results.data;
                                if(!data || data.length===0) { alert('CSV 文件为空或格式不正确'); dataStatus.textContent='导入失败'; return; }
                                var headers = results.meta.fields;
                                if(!headers.includes('Country') || !headers.includes('Rank')) {
                                    alert('CSV 必须包含 "Country" 和 "Rank" 列。');
                                    dataStatus.textContent='格式错误';
                                    return;
                                }
                                var dimKeys = headers.filter(function(h){ return h!=='Country' && h!=='Rank'; });
                                if(dimKeys.length===0) { alert('请至少添加一个维度列（如 Factor1, Factor2...）'); dataStatus.textContent='缺少维度'; return; }

                                var allCountries = [];
                                data.forEach(function(row) {
                                    var country = row['Country'];
                                    if(!country) return;
                                    var score = parseFloat(row['Rank']);
                                    if(isNaN(score)) return;
                                    var dims = {};
                                    dimKeys.forEach(function(key) {
                                        var val = parseFloat(row[key]);
                                        dims[key] = isNaN(val) ? null : val;
                                    });
                                    allCountries.push({ country:country.toLowerCase().trim(), score:score, dims:dims });
                                });
                                if(allCountries.length===0) { alert('未解析到有效数据，请检查 CSV 格式。'); dataStatus.textContent='导入失败'; return; }

                                allCountries.sort(function(a,b){ return b.score-a.score; });
                                var rank=0, prevScore=null;
                                allCountries.forEach(function(item,index) {
                                    if(item.score!==prevScore) { rank=index+1; prevScore=item.score; }
                                    item.rankNumber=rank;
                                });

                                wjpData = {};
                                allCountries.forEach(function(item) {
                                    wjpData[item.country] = { rankNumber:item.rankNumber, score:item.score, dims:item.dims };
                                    if(item.country==="united states") {
                                        wjpData["usa"] = wjpData[item.country];
                                        wjpData["us"] = wjpData[item.country];
                                        wjpData["america"] = wjpData[item.country];
                                    }
                                    if(item.country==="united kingdom") wjpData["uk"] = wjpData[item.country];
                                    if(item.country==="united arab emirates") wjpData["uae"] = wjpData[item.country];
                                });

                                dataStatus.textContent = '✅ 已导入 ('+allCountries.length+' 个国家)';
                                dataStatus.className = 'loaded';
                                fileInput.value = '';
                                alert('数据导入成功！点击国家即可查看 WJP 数值。');
                            },
                            error:function(err) {
                                alert('解析 CSV 失败：'+err.message);
                                dataStatus.textContent='导入失败';
                            }
                        });
                    });

                    // ============================================================
                    // ⭐ 修复浮窗位置：在 map 容器上记录鼠标位置，点击时使用
                    // ============================================================
                    var lastMouseX = window.innerWidth / 2;
                    var lastMouseY = window.innerHeight / 2;

                    // 监听地图容器上的鼠标移动，记录最新坐标
                    document.getElementById('map').addEventListener('mousemove', function(e) {
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                    });

                    // 也监听触摸事件（手机端）
                    document.getElementById('map').addEventListener('touchmove', function(e) {
                        var touch = e.touches[0];
                        if (touch) {
                            lastMouseX = touch.clientX;
                            lastMouseY = touch.clientY;
                        }
                    }, { passive: true });

                    // 点击地图显示浮窗，使用记录的鼠标位置
                    myChart.on('click', function(params) {
                        var name = params.name;
                        if (!name) return;
                        showCountryInfo(name, lastMouseX, lastMouseY);
                    });

                    // 点击空白区域关闭浮窗
                    myChart.getZr().on('click', function(e) {
                        var target = e.target;
                        if (target && target.parent && target.parent.__ecComponentInfo) return;
                        if (panel && panel.style.display !== 'none') {
                            panel.style.display = 'none';
                        }
                    });

                    console.log('✅ 地图初始化完成，新加坡已添加，浮窗位置已修复');
                } catch(err) {
                    console.error('初始化地图出错:', err);
                    document.getElementById('map').innerHTML = '<div style="text-align:center;padding-top:100px;color:#d9534f;">❌ 地图初始化失败，请检查控制台错误信息。</div>';
                }
            }

            // 开始加载
            tryLoadMirror(0);
        })();
    </script>
</body>
</html>
